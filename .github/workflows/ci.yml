name: CI

on:
  pull_request:
  push:
    branches:
      - refactor

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  CI: "true"
  EMAIL_TRANSPORT: fake
  SUPABASE_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          ./node_modules/.bin/prettier --check \
            .github/workflows/ci.yml \
            playwright.config.ts

      - name: Validate Supabase SQL statically
        run: npm run db:static

      - name: Lint
        run: npm run lint

  types:
    name: TypeScript 7 and fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck with TypeScript 7
        run: |
          ./node_modules/.bin/tsc --version
          npm run typecheck

      - name: Typecheck with supported TypeScript fallback
        run: |
          ./node_modules/.bin/tsc6 --version
          npm run typecheck:ts6

  unit:
    name: Unit and DOM integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prove booking rules ignore runner timezone
        run: npm run test:booking:timezones

  build:
    name: Isolated production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Build without provider credentials
        run: npm run build

  security:
    name: Secrets and production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan current tree and full history
        run: npm run security:secrets

      - name: Audit production dependencies
        run: npm run security:dependencies

  database:
    name: Local Supabase migrations and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.21.1"
          test "$(npm --version)" = "10.9.4"

      - name: Install locked dependencies
        run: npm ci

      - name: Prove the database lane is local and unlinked
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test ! -e supabase/.temp/project-ref
          test "$(./node_modules/.bin/supabase --version)" = "2.105.0"

      - name: Start ephemeral local Supabase
        run: npm run db:start:ci

      - name: Reset, lint, advise, and test first clean database
        run: |
          npm run db:reset
          npm run db:lint
          npm run db:advisors
          npm run db:test
          npm run db:test:concurrency

      - name: Repeat from a second clean database
        run: |
          npm run db:reset
          npm run db:lint
          npm run db:advisors
          npm run db:test
          npm run db:test:concurrency

      - name: Remove ephemeral database volumes
        if: always()
        run: npm run db:clean
